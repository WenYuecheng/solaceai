[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaceai-core"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0", "sqlalchemy==2.0.36", "pymysql==1.1.1", "cryptography==50.0.0", "redis==5.2.1", "pydantic-settings==2.7.1", "python-multipart==0.0.20", "httpx==0.28.1", "certifi>=2024.8.30", "openpyxl==3.1.5", "mcp==2.1.0; python_version >= \"3.10\"", "langchain-core==1.6.7", "langgraph==1.2.14", "langgraph-checkpoint-sqlite==3.1.1", "argon2-cffi==25.1.0", "llama-index-core==0.14.25", "sse-starlette==3.0.3", "tiktoken==0.14.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["knowledge/*", "assets/tokenizer/*", "assets/amap-cities.json", "skills/**/*", "static/**/*"]
