name: solaceai-rag
# 本机检索服务，独立于业务MySQL/Redis。
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: [etcd, -advertise-client-urls=http://etcd:2379, -listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes: [rag-etcd:/etcd]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: [minio, server, /data]
    environment:
      MINIO_ROOT_USER: solaceai-local
      MINIO_ROOT_PASSWORD: solaceai-local-development
    volumes: [rag-minio:/data]
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.6.21
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: solaceai-local
      MINIO_SECRET_ACCESS_KEY: solaceai-local-development
      MQ_TYPE: woodpecker
    ports: ['127.0.0.1:19530:19530', '127.0.0.1:19091:9091']
    volumes: [rag-milvus:/var/lib/milvus]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  rag-etcd:
  rag-minio:
  rag-milvus:
