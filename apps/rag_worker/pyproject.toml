[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "solaceai-rag-worker"
version = "1.0.0"
requires-python = ">=3.11"
[project.scripts]
solaceai-rag-worker = "apps.rag_worker.main:main"
[tool.setuptools]
packages = ["apps.rag_worker"]
package-dir = {"apps.rag_worker" = "."}

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", ".env", ".env.*"]
