[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaceai-offline"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["solaceai-core==1.0.0", "pymilvus==2.6.17"]

[project.entry-points."solaceai.backends"]
offline = "apps.offline.backend:OfflineBackend"

[project.scripts]
solaceai-offline = "apps.offline.main:run"

[tool.setuptools]
packages = ["apps.offline"]
package-dir = {"apps.offline" = "."}

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", ".env", ".env.*"]
